[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-ai-backend"
version = "0.1.0"
description = "Medical AI infrastructure foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "fastapi==0.163.2",
  "starlette==1.3.1",
  "uvicorn==0.38.0",
  "pydantic-settings==2.11.0",
  "celery[redis]==5.5.3",
  "sqlalchemy==2.0.44",
  "alembic==1.17.1",
  "psycopg[binary]==3.2.12",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "minio==7.2.18",
  "python-multipart==0.0.31",
  "pymupdf==1.26.7",
  "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==9.0.3",
  "ruff==0.14.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", "*.egg-info"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires dedicated PostgreSQL test database"]
