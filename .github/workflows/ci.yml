name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked files and reachable history for secrets
        run: python3 -B .github/scripts/audit_git.py --history

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install application and test dependencies
        run: |
          if [ -f requirements-dev.lock ]; then
            python -m pip install --require-hashes -r requirements-dev.lock
            python -m pip install --no-deps .
          else
            python -m pip install '.[dev]'
          fi
          python -m pip check
      - name: Audit installed Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit-env"
          "$RUNNER_TEMP/pip-audit-env/bin/python" -m pip install 'pip-audit==2.9.0'
          packages=$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          inventory="$RUNNER_TEMP/pip-audit-requirements.txt"
          # Audit the installed third-party versions without resolving them again.
          python -m pip list --path "$packages" --format=freeze --exclude medical-ai-backend > "$inventory"
          test -s "$inventory"
          "$RUNNER_TEMP/pip-audit-env/bin/pip-audit" -r "$inventory" --no-deps --disable-pip
      - name: Ruff
        run: python -m ruff check .
      - name: Python type checking
        run: python -m mypy app
      - name: Backend unit tests
        run: python -m pytest -m 'not integration' --junitxml=junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-test-results
          path: backend/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --package-lock --no-audit --no-fund
          fi
      - name: Audit resolved Node.js dependencies
        id: npm_audit
        run: npm audit --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json"
      - name: Upload npm audit findings and resolved dependency tree
        if: failure() && steps.npm_audit.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-npm-audit
          path: |
            ${{ runner.temp }}/npm-audit.json
            frontend/package-lock.json
          retention-days: 7
      - name: ESLint
        run: npm run lint
      - name: TypeScript checks
        run: npm run typecheck
      - name: Frontend tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-test-results
          path: frontend/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  migrations-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: medical_ai_test
          POSTGRES_USER: medical_ai_test
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U medical_ai_test -d medical_ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUN_AUTH_INTEGRATION: "1"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: medical_ai_test
      POSTGRES_USER: medical_ai_test
      POSTGRES_PASSWORD: synthetic-ci-only-password
      REDIS_PASSWORD: synthetic-unused-password
      AUTH_ORIGIN: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          if [ -f requirements-dev.lock ]; then
            python -m pip install --require-hashes -r requirements-dev.lock
            python -m pip install --no-deps .
          else
            python -m pip install '.[dev]'
          fi
      - name: Render migrations without a database connection
        run: |
          python -m alembic upgrade head --sql > "$RUNNER_TEMP/migrations.sql"
          grep -q 'CREATE TABLE alembic_version' "$RUNNER_TEMP/migrations.sql"
      - name: Test migrations, schema drift and auth against ephemeral PostgreSQL
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: python -m pytest -m integration tests/test_auth_integration.py --junitxml=integration.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: auth-integration-results
          path: backend/integration.xml
          if-no-files-found: ignore
          retention-days: 7

  document-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_DISABLE_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and start synthetic document stack
        run: |
          docker compose -p medical-ai-ci -f infrastructure/compose.documents-test.yaml build
          docker compose -p medical-ai-ci -f infrastructure/compose.documents-test.yaml up -d --wait --wait-timeout 240 postgres redis minio worker
      - name: Exercise document API, outbox recovery and worker
        run: |
          docker compose -p medical-ai-ci -f infrastructure/compose.documents-test.yaml run --rm --no-deps tests \
            python -m pytest -m integration tests/test_document_ingestion_integration.py

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build runtime image without publishing
        run: |
          docker build --target runtime -f "infrastructure/docker/${{ matrix.component }}.Dockerfile" \
            --tag "medical-ai/${{ matrix.component }}:ci" .

  compose-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Compose topology
        run: |
          docker compose --env-file .env.example -f infrastructure/compose.yaml -f infrastructure/compose.dev.yaml config --quiet
          docker compose --env-file .env.example -f infrastructure/compose.yaml -f infrastructure/compose.production.yaml config --quiet
