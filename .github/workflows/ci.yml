name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          if [ -f requirements-dev.lock ]; then
            python -m pip install --require-hashes -r requirements-dev.lock
            python -m pip install --no-deps .
          else
            python -m pip install '.[dev]'
          fi
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Typecheck
        run: python -m mypy app
      - name: Unit tests
        run: python -m pytest -m 'not integration' --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/junit.xml
          if-no-files-found: ignore

  auth-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: medical_ai_test
          POSTGRES_USER: medical_ai_test
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medical_ai_test -d medical_ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUN_AUTH_INTEGRATION: "1"
      POSTGRES_HOST: localhost
      POSTGRES_DB: medical_ai_test
      POSTGRES_USER: medical_ai_test
      POSTGRES_PASSWORD: synthetic-ci-only-password
      REDIS_PASSWORD: synthetic-unused-password
      AUTH_ORIGIN: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[dev]'
      - name: Additive migrations, schema drift and API integration
        run: python -m pytest -m integration --junitxml=integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-integration-results
          path: backend/integration.xml

  document-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated test environment
        run: docker compose -p medical-ai-stage3-tests -f infrastructure/compose.documents-test.yaml build
      - name: Start synthetic stores and real worker
        run: docker compose -p medical-ai-stage3-tests -f infrastructure/compose.documents-test.yaml up -d --wait --wait-timeout 240 postgres redis minio worker
      - name: Auth, document API, outbox recovery and real processing
        run: docker compose -p medical-ai-stage3-tests -f infrastructure/compose.documents-test.yaml run --rm tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --package-lock=false; fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: frontend/junit.xml
          if-no-files-found: ignore

  docker-build:
    needs: [backend, frontend, auth-integration, document-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: backend, dockerfile: infrastructure/docker/backend.Dockerfile}
          - {name: frontend, dockerfile: infrastructure/docker/frontend.Dockerfile}
          - {name: mlflow, dockerfile: infrastructure/docker/mlflow.Dockerfile}
          - {name: minio, dockerfile: infrastructure/docker/minio.Dockerfile, target: server}
          - {name: minio-client, dockerfile: infrastructure/docker/minio.Dockerfile, target: client}
          - {name: qdrant, dockerfile: infrastructure/docker/qdrant.Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          tags: medical-ai/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate development topology without starting services
        run: docker compose --env-file .env.example -f infrastructure/compose.yaml -f infrastructure/compose.dev.yaml config --quiet
      - name: Validate production topology without starting services
        run: docker compose --env-file .env.example -f infrastructure/compose.yaml -f infrastructure/compose.production.yaml config --quiet
