# Optional egress for the existing worker. Base Compose remains local.
services:
  worker:
    environment:
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-3-Ultra}
      GIGACHAT_CA_BUNDLE: ${GIGACHAT_CA_BUNDLE:-}
    volumes:
      - type: bind
        source: ${GIGACHAT_CA_DIR:-./certs/gigachat}
        target: /run/gigachat-ca
        read_only: true
        bind:
          create_host_path: false
    networks:
      - document-extraction-egress

networks:
  document-extraction-egress: {}
