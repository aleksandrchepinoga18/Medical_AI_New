# Optional stage 4; combine with base and exactly one app environment override.
services:
  ollama:
    image: ollama/ollama:0.6.8
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes: [ollama-models:/root/.ollama]
    networks: [vectors]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

volumes:
  ollama-models:
